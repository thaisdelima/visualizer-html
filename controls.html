<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controles - Neon VJ Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        html {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        body {
            background-color: #000;
            color: white;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100%;
            margin: 0;
        }
        
        /* Scrollbar personalizada para WebKit (Chrome, Safari, Edge) */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a202c;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }
        
        /* Scrollbar para Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #1a202c;
        }
    </style>
</head>
<body class="p-4 min-h-full">
    <div class="max-w-4xl mx-auto pb-4">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
            <h2 class="text-cyan-400 font-bold text-xl">CONTROLES</h2>
            <div class="flex items-center gap-4">
                <div id="fps-counter" class="text-gray-400">FPS: 00</div>
                <button onclick="window.close()" class="text-gray-400 hover:text-white transition-colors p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Cenas sem Imagem -->
        <div class="mb-5">
            <h3 class="text-purple-400 font-bold mb-3 uppercase tracking-wider text-sm">Cenas sem Imagem</h3>
            
            <!-- Cenas 2D (p5.js) -->
            <div class="mb-3">
                <h4 class="text-gray-400 text-xs mb-2 uppercase tracking-wider">2D (p5.js)</h4>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 max-h-40 overflow-y-auto overflow-x-hidden pr-2" style="scrollbar-width: thin; scrollbar-color: #4a5568 #1a202c;">
                    <button onclick="changeScene(1)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-1">Espectro</button>
                    <button onclick="changeScene(2)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-2">Partículas</button>
                    <button onclick="changeScene(3)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-3">Túnel</button>
                    <button onclick="changeScene(4)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-4">Glitch</button>
                    <button onclick="changeScene(5)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-5">Onda</button>
                    <button onclick="changeScene(6)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-6">Mandala</button>
                    <button onclick="changeScene(7)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-7">Matrix</button>
                    <button onclick="changeScene(8)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-8">Pixels</button>
                    <button onclick="changeScene(9)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-9">Estrelas</button>
                    <button onclick="changeScene(10)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-10">Flow</button>
                </div>
            </div>
            
            <!-- Cenas 3D (Three.js) -->
            <div>
                <h4 class="text-gray-400 text-xs mb-2 uppercase tracking-wider">3D (Three.js)</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2">
                    <button onclick="changeScene(11)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-11">
                        <span>City</span> <span class="text-gray-500 text-[10px] mt-1">[Q]</span>
                    </button>
                    <button onclick="changeScene(12)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-12">
                        <span>Vortex</span> <span class="text-gray-500 text-[10px] mt-1">[W]</span>
                    </button>
                    <button onclick="changeScene(13)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-13">
                        <span>Planet</span> <span class="text-gray-500 text-[10px] mt-1">[E]</span>
                    </button>
                    <button onclick="changeScene(14)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-14">
                        <span>Falling Balls</span> <span class="text-gray-500 text-[10px] mt-1">[R]</span>
                    </button>
                    <button onclick="changeScene(21)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-21">
                        <span>Silhueta</span> <span class="text-gray-500 text-[10px] mt-1">[T]</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Upload de Mídia -->
        <div class="mb-5 p-3 bg-gray-900/50 rounded border border-gray-700">
            <h3 class="text-pink-400 font-bold mb-3 uppercase tracking-wider text-sm">Mídia de Referência</h3>
            <div class="space-y-3">
                <div>
                    <label class="block mb-1 text-xs text-gray-400">Imagem</label>
                    <input type="file" id="image-upload" accept="image/*" class="w-full text-xs text-white file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500">
                </div>
                <button onclick="clearMedia()" class="w-full py-2 bg-red-600/50 hover:bg-red-600 text-white text-xs rounded transition">
                    Limpar Mídia
                </button>
            </div>
        </div>

        <!-- Cenas com Imagem -->
        <div class="mb-5">
            <h3 class="text-pink-400 font-bold mb-3 uppercase tracking-wider text-sm">Cenas com Imagem</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                <button onclick="changeScene(15)" class="p-2 bg-gray-800 hover:bg-pink-900 border border-gray-700 hover:border-pink-500 rounded transition text-center" id="btn-scene-15">Partículas de Cor</button>
                <button onclick="changeScene(17)" class="p-2 bg-gray-800 hover:bg-pink-900 border border-gray-700 hover:border-pink-500 rounded transition text-center" id="btn-scene-17">Pixel Art</button>
                <button onclick="changeScene(18)" class="p-2 bg-gray-800 hover:bg-pink-900 border border-gray-700 hover:border-pink-500 rounded transition text-center" id="btn-scene-18">Contornos Reativos</button>
                <button onclick="changeScene(19)" class="p-2 bg-gray-800 hover:bg-pink-900 border border-gray-700 hover:border-pink-500 rounded transition text-center" id="btn-scene-19">Formas Reativas</button>
                <button onclick="changeScene(20)" class="p-2 bg-gray-800 hover:bg-pink-900 border border-gray-700 hover:border-pink-500 rounded transition text-center" id="btn-scene-20">Partículas de Forma</button>
            </div>
        </div>

        <!-- Seção de Áudio -->
        <div class="mb-5">
            <h3 class="text-green-400 font-bold mb-3 uppercase tracking-wider text-sm">Áudio & Beat</h3>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span class="text-red-400">Sensibilidade Bass</span> <span id="val-sensBass">1.5</span></label>
                <input type="range" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('sensBass', this.value)">
            </div>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span class="text-yellow-400">Sensibilidade Mid</span> <span id="val-sensMid">1.5</span></label>
                <input type="range" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('sensMid', this.value)">
            </div>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span class="text-blue-400">Sensibilidade Treble</span> <span id="val-sensTreble">1.5</span></label>
                <input type="range" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('sensTreble', this.value)">
            </div>
            
            <!-- Visualizador de Níveis -->
            <div class="mt-2">
                <div class="flex gap-1 h-8 mb-1">
                    <div class="flex-1 bg-gray-900 flex flex-col justify-end relative border border-gray-700">
                        <div id="bar-bass" class="bg-red-500 w-full opacity-80" style="height: 0%"></div>
                    </div>
                    <div class="flex-1 bg-gray-900 flex flex-col justify-end relative border border-gray-700">
                        <div id="bar-mid" class="bg-yellow-500 w-full opacity-80" style="height: 0%"></div>
                    </div>
                    <div class="flex-1 bg-gray-900 flex flex-col justify-end relative border border-gray-700">
                        <div id="bar-treble" class="bg-blue-500 w-full opacity-80" style="height: 0%"></div>
                    </div>
                </div>
                <div class="flex gap-1 text-xs text-gray-400">
                    <div class="flex-1 text-center">
                        <span class="text-red-400">Bass: </span><span id="val-bass">0</span>
                    </div>
                    <div class="flex-1 text-center">
                        <span class="text-yellow-400">Mid: </span><span id="val-mid">0</span>
                    </div>
                    <div class="flex-1 text-center">
                        <span class="text-blue-400">Treble: </span><span id="val-treble">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Seção Visual -->
        <div class="mb-5">
            <h3 class="text-yellow-400 font-bold mb-3 uppercase tracking-wider text-sm">Ajustes Visuais</h3>
            
            <!-- Seletor de Paleta -->
            <div class="mb-3">
                <label class="block mb-1"><span>Paleta de Cores</span></label>
                <select id="palette-select" onchange="changePalette(this.value)" class="w-full bg-gray-900 border border-gray-700 text-white rounded p-2 text-sm focus:border-cyan-500 focus:outline-none">
                    <option value="neon" selected>Neon</option>
                    <option value="fire">Fogo</option>
                    <option value="ocean">Oceano</option>
                    <option value="forest">Floresta</option>
                    <option value="sunset">Pôr do Sol</option>
                    <option value="rainbow">Arco-íris</option>
                    <option value="monochrome">Monocromático</option>
                    <option value="custom">Personalizado</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span>Velocidade</span> <span id="val-speed">1.0</span></label>
                <input type="range" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateParam('speed', this.value)">
            </div>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span>Matiz (Cor)</span> <span id="val-hue">0</span></label>
                <input type="range" min="0" max="360" step="1" value="0" oninput="updateParam('hue', this.value)">
            </div>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span>Rastro (Trail)</span> <span id="val-trail">40</span></label>
                <input type="range" min="0" max="255" step="5" value="40" oninput="updateParam('trail', this.value)">
            </div>
        </div>

        <!-- Pads de Efeitos -->
        <div class="mb-5">
            <h3 class="text-cyan-400 font-bold mb-3 uppercase tracking-wider text-sm">Pads de Efeitos</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button onclick="toggleEffect('mirror')" id="pad-mirror" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">🪞</div>
                    <div>Espelho</div>
                </button>
                <button onclick="toggleEffect('kaleidoscope')" id="pad-kaleidoscope" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">🔮</div>
                    <div>Caleidoscópio</div>
                </button>
                <button onclick="toggleEffect('invert')" id="pad-invert" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">🔄</div>
                    <div>Inverter</div>
                </button>
                <button onclick="toggleEffect('glow')" id="pad-glow" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">✨</div>
                    <div>Brilho</div>
                </button>
                <button onclick="toggleEffect('pixelate')" id="pad-pixelate" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">🔲</div>
                    <div>Pixelizar</div>
                </button>
                <button onclick="toggleEffect('blur')" id="pad-blur" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">🌫️</div>
                    <div>Desfoque</div>
                </button>
                <button onclick="toggleEffect('rotate')" id="pad-rotate" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">🌀</div>
                    <div>Rotacionar</div>
                </button>
                <button onclick="toggleEffect('scale')" id="pad-scale" class="p-3 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center text-xs font-semibold">
                    <div class="text-lg mb-1">📏</div>
                    <div>Escala</div>
                </button>
            </div>
            
            <!-- Controles de Parâmetros dos Efeitos -->
            <div id="effect-controls" class="mt-3 p-3 bg-gray-900/50 rounded border border-gray-700 hidden">
                <h4 class="text-gray-400 text-xs mb-2 uppercase">Parâmetros</h4>
                <div id="effect-params-content" class="space-y-2">
                    <!-- Parâmetros serão inseridos dinamicamente aqui -->
                </div>
            </div>
        </div>

        <!-- Ações Globais -->
        <div>
            <button onmousedown="triggerStrobe(true)" onmouseup="triggerStrobe(false)" onmouseleave="triggerStrobe(false)" class="w-full py-3 bg-white text-black font-bold uppercase tracking-widest hover:bg-gray-200 active:bg-red-500 active:text-white transition rounded mb-2">
                FLASH (Space)
            </button>
            <p class="text-gray-500 text-[10px] text-center italic">Tecla 'H' para abrir/fechar controles</p>
        </div>
    </div>

    <script>
        // Funções para comunicação com a janela principal
        function changeScene(n) {
            if (window.opener && typeof window.opener.changeScene === 'function') {
                window.opener.changeScene(n);
                updateSceneButtons(n);
            }
        }
        
        function updateParam(k, v) {
            if (window.opener && typeof window.opener.updateParam === 'function') {
                window.opener.updateParam(k, v);
            }
            document.getElementById(`val-${k}`).innerText = v;
        }
        
        function triggerStrobe(v) {
            if (window.opener && typeof window.opener.triggerStrobe === 'function') {
                window.opener.triggerStrobe(v);
            }
        }
        
        function changePalette(paletteName) {
            if (window.opener && typeof window.opener.changePalette === 'function') {
                window.opener.changePalette(paletteName);
            }
        }
        
        function toggleEffect(effectName) {
            if (window.opener && typeof window.opener.toggleEffect === 'function') {
                let isActive = window.opener.toggleEffect(effectName);
                updateEffectPadUI(effectName, isActive);
                updateEffectControls(effectName, isActive);
            }
        }
        
        function updateEffectParam(effectName, paramName, value) {
            if (window.opener && typeof window.opener.updateEffectParam === 'function') {
                window.opener.updateEffectParam(effectName, paramName, value);
            }
        }
        
        function updateEffectPadUI(effectName, isActive) {
            let pad = document.getElementById(`pad-${effectName}`);
            if (pad) {
                if (isActive) {
                    pad.classList.add('bg-cyan-900', 'border-cyan-500');
                    pad.classList.remove('bg-gray-800', 'border-gray-700');
                } else {
                    pad.classList.remove('bg-cyan-900', 'border-cyan-500');
                    pad.classList.add('bg-gray-800', 'border-gray-700');
                }
            }
        }
        
        function updateEffectControls(effectName, isActive) {
            let controlsDiv = document.getElementById('effect-controls');
            let paramsContent = document.getElementById('effect-params-content');
            
            if (!isActive) {
                // Se o efeito foi desativado, verificar se há outros ativos
                let hasActive = false;
                if (window.opener && window.opener.EffectsManager) {
                    let active = window.opener.EffectsManager.getActiveEffects();
                    hasActive = active.length > 0;
                }
                if (!hasActive) {
                    controlsDiv.classList.add('hidden');
                }
                return;
            }
            
            // Mostrar controles
            controlsDiv.classList.remove('hidden');
            
            // Limpar conteúdo anterior
            paramsContent.innerHTML = '';
            
            // Adicionar controles específicos do efeito
            let controlsHTML = '';
            
            switch(effectName) {
                case 'mirror':
                    controlsHTML = `
                        <div>
                            <label class="flex justify-between mb-1 text-xs"><span>Eixo</span></label>
                            <select onchange="updateEffectParam('mirror', 'axis', this.value)" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-1 text-xs">
                                <option value="x">Horizontal</option>
                                <option value="y">Vertical</option>
                                <option value="both">Ambos</option>
                            </select>
                        </div>
                    `;
                    break;
                case 'kaleidoscope':
                    controlsHTML = `
                        <div>
                            <label class="flex justify-between mb-1 text-xs"><span>Segmentos</span> <span id="val-kaleidoscope-segments">6</span></label>
                            <input type="range" min="3" max="12" step="1" value="6" oninput="updateEffectParam('kaleidoscope', 'segments', this.value); document.getElementById('val-kaleidoscope-segments').innerText = this.value;">
                        </div>
                    `;
                    break;
                case 'rotate':
                    controlsHTML = `
                        <div class="mb-2">
                            <label class="flex justify-between mb-1 text-xs"><span>Ângulo</span> <span id="val-rotate-angle">0</span></label>
                            <input type="range" min="0" max="360" step="1" value="0" oninput="updateEffectParam('rotate', 'angle', this.value); document.getElementById('val-rotate-angle').innerText = this.value;">
                        </div>
                        <div>
                            <label class="flex justify-between mb-1 text-xs"><span>Velocidade</span> <span id="val-rotate-speed">0</span></label>
                            <input type="range" min="0" max="5" step="0.1" value="0" oninput="updateEffectParam('rotate', 'speed', this.value); document.getElementById('val-rotate-speed').innerText = this.value;">
                        </div>
                    `;
                    break;
                case 'scale':
                    controlsHTML = `
                        <div class="mb-2">
                            <label class="flex justify-between mb-1 text-xs"><span>Fator</span> <span id="val-scale-factor">1.0</span></label>
                            <input type="range" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateEffectParam('scale', 'factor', this.value); document.getElementById('val-scale-factor').innerText = this.value;">
                        </div>
                        <div>
                            <label class="flex items-center gap-2 text-xs">
                                <input type="checkbox" onchange="updateEffectParam('scale', 'pulse', this.checked)" class="w-4 h-4">
                                <span>Pulsar com áudio</span>
                            </label>
                        </div>
                    `;
                    break;
                case 'glow':
                    controlsHTML = `
                        <div class="mb-2">
                            <label class="flex justify-between mb-1 text-xs"><span>Intensidade</span> <span id="val-glow-intensity">0.5</span></label>
                            <input type="range" min="0" max="1" step="0.1" value="0.5" oninput="updateEffectParam('glow', 'intensity', this.value); document.getElementById('val-glow-intensity').innerText = this.value;">
                        </div>
                        <div>
                            <label class="flex justify-between mb-1 text-xs"><span>Raio</span> <span id="val-glow-radius">10</span></label>
                            <input type="range" min="5" max="30" step="1" value="10" oninput="updateEffectParam('glow', 'radius', this.value); document.getElementById('val-glow-radius').innerText = this.value;">
                        </div>
                    `;
                    break;
                case 'pixelate':
                    controlsHTML = `
                        <div>
                            <label class="flex justify-between mb-1 text-xs"><span>Tamanho</span> <span id="val-pixelate-size">8</span></label>
                            <input type="range" min="2" max="20" step="1" value="8" oninput="updateEffectParam('pixelate', 'size', this.value); document.getElementById('val-pixelate-size').innerText = this.value;">
                        </div>
                    `;
                    break;
                case 'blur':
                    controlsHTML = `
                        <div>
                            <label class="flex justify-between mb-1 text-xs"><span>Quantidade</span> <span id="val-blur-amount">5</span></label>
                            <input type="range" min="1" max="20" step="1" value="5" oninput="updateEffectParam('blur', 'amount', this.value); document.getElementById('val-blur-amount').innerText = this.value;">
                        </div>
                    `;
                    break;
            }
            
            if (controlsHTML) {
                paramsContent.innerHTML = `<div class="text-xs text-gray-400 mb-2 font-semibold uppercase">${effectName}</div>` + controlsHTML;
            }
        }
        
        function updateSceneButtons(currentScene) {
            // Cenas 2D (1-10)
            for (let i = 1; i <= 10; i++) {
                let btn = document.getElementById(`btn-scene-${i}`);
                if (btn) {
                    let activeClass = 'bg-cyan-900 border-cyan-500';
                    let hoverClass = 'hover:bg-cyan-900 hover:border-cyan-500';
                    btn.className = `p-2 border rounded transition text-center ${i === currentScene ? activeClass + ' text-white' : 'bg-gray-800 border-gray-700 text-gray-300 ' + hoverClass}`;
                }
            }
            // Cenas 3D (11-14)
            for (let i = 11; i <= 14; i++) {
                let btn = document.getElementById(`btn-scene-${i}`);
                if (btn) {
                    let activeClass = 'bg-orange-900 border-orange-500';
                    let hoverClass = 'hover:bg-orange-900 hover:border-orange-500';
                    btn.className = `p-2 border rounded transition text-center flex justify-between px-4 ${i === currentScene ? activeClass + ' text-white' : 'bg-gray-800 border-gray-700 text-gray-300 ' + hoverClass}`;
                }
            }
            // Cenas com Mídia (15, 17-20)
            for (let i = 14; i <= 20; i++) {
                if (i === 14 || i === 16) continue; // Pular cenas 14 e 16 (removidas)
                let btn = document.getElementById(`btn-scene-${i}`);
                if (btn) {
                    let activeClass = 'bg-pink-900 border-pink-500';
                    let hoverClass = 'hover:bg-pink-900 hover:border-pink-500';
                    btn.className = `p-2 border rounded transition text-center ${i === currentScene ? activeClass + ' text-white' : 'bg-gray-800 border-gray-700 text-gray-300 ' + hoverClass}`;
                }
            }
        }
        
        // Função helper para map (já que não temos p5.js aqui)
        function map(value, start1, stop1, start2, stop2) {
            return start2 + (stop2 - start2) * ((value - start1) / (stop1 - start1));
        }
        
        // Atualizar FPS e UI de áudio periodicamente
        setInterval(function() {
            if (window.opener && window.opener.AudioManager) {
                let audioData = window.opener.AudioManager.audioData;
                if (audioData) {
                    // Atualizar barras de áudio
                    let barBass = document.getElementById('bar-bass');
                    let barMid = document.getElementById('bar-mid');
                    let barTreble = document.getElementById('bar-treble');
                    
                    if (barBass && audioData.bass !== undefined) {
                        let height = map(audioData.bass, 0, 255, 0, 100);
                        barBass.style.height = height + '%';
                        let valBass = document.getElementById('val-bass');
                        if (valBass) valBass.innerText = Math.round(audioData.bass);
                    }
                    if (barMid && audioData.mid !== undefined) {
                        let height = map(audioData.mid, 0, 255, 0, 100);
                        barMid.style.height = height + '%';
                        let valMid = document.getElementById('val-mid');
                        if (valMid) valMid.innerText = Math.round(audioData.mid);
                    }
                    if (barTreble && audioData.treble !== undefined) {
                        let height = map(audioData.treble, 0, 255, 0, 100);
                        barTreble.style.height = height + '%';
                        let valTreble = document.getElementById('val-treble');
                        if (valTreble) valTreble.innerText = Math.round(audioData.treble);
                    }
                }
            }
            
            // Atualizar FPS
            if (window.opener && typeof window.opener.frameRate === 'function') {
                let fps = Math.floor(window.opener.frameRate());
                document.getElementById('fps-counter').innerText = 'FPS: ' + fps;
            }
        }, 100);
        
        // Funções de upload de mídia
        function loadImage(file) {
            if (window.opener && window.opener.MediaManager) {
                window.opener.MediaManager.loadImage(file);
            }
        }
        
        function clearMedia() {
            if (window.opener && window.opener.MediaManager) {
                window.opener.MediaManager.clear();
            }
        }
        
        // Event listeners para upload
        window.addEventListener('load', function() {
            let imageUpload = document.getElementById('image-upload');
            
            if (imageUpload) {
                imageUpload.addEventListener('change', function(e) {
                    if (e.target.files && e.target.files[0]) {
                        loadImage(e.target.files[0]);
                    }
                });
            }
            
            // Sincronizar valores iniciais
            if (window.opener && window.opener.params) {
                let params = window.opener.params;
                document.getElementById('val-sensBass').innerText = params.sensBass || 1.5;
                document.getElementById('val-sensMid').innerText = params.sensMid || 1.5;
                document.getElementById('val-sensTreble').innerText = params.sensTreble || 1.5;
                document.getElementById('val-speed').innerText = params.speed || 1.0;
                document.getElementById('val-hue').innerText = params.hue || 0;
                document.getElementById('val-trail').innerText = params.trail || 40;
                
                // Sincronizar sliders
                let sensBassSlider = document.querySelector('input[oninput*="sensBass"]');
                let sensMidSlider = document.querySelector('input[oninput*="sensMid"]');
                let sensTrebleSlider = document.querySelector('input[oninput*="sensTreble"]');
                let speedSlider = document.querySelector('input[oninput*="speed"]');
                let hueSlider = document.querySelector('input[oninput*="hue"]');
                let trailSlider = document.querySelector('input[oninput*="trail"]');
                
                if (sensBassSlider) sensBassSlider.value = params.sensBass || 1.5;
                if (sensMidSlider) sensMidSlider.value = params.sensMid || 1.5;
                if (sensTrebleSlider) sensTrebleSlider.value = params.sensTreble || 1.5;
                if (speedSlider) speedSlider.value = params.speed || 1.0;
                if (hueSlider) hueSlider.value = params.hue || 0;
                if (trailSlider) trailSlider.value = params.trail || 40;
                
                // Sincronizar paleta
                let paletteSelect = document.getElementById('palette-select');
                if (paletteSelect && params.palette) {
                    paletteSelect.value = params.palette;
                }
                
                // Sincronizar estados dos efeitos
                if (window.opener && window.opener.EffectsManager) {
                    let effects = window.opener.EffectsManager.activeEffects;
                    for (let effectName in effects) {
                        if (effects[effectName]) {
                            updateEffectPadUI(effectName, true);
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
