<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon VJ Studio - p5.js + Three.js</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- p5.js e p5.sound -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Overlay de Início -->
    <div id="start-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-500">
        <h1 class="text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 animate-pulse">NEON VJ STUDIO</h1>
        <p class="mb-8 text-gray-300 text-xl">Sistema Híbrido p5.js + Three.js</p>
        <button onclick="startAudio()" class="px-8 py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-full text-xl shadow-[0_0_20px_rgba(6,182,212,0.6)] transition-all transform hover:scale-105">
            INICIAR SISTEMA
        </button>
        <p class="mt-4 text-sm text-gray-500">Permita o acesso ao microfone.</p>
    </div>

    <!-- Painel de Controle -->
    <div id="controls" class="fixed top-4 left-4 z-40 w-72 bg-black/80 backdrop-blur-md p-4 rounded-lg neon-border text-xs hidden max-h-[90vh] overflow-y-auto no-scrollbar">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h2 class="text-cyan-400 font-bold text-lg">CONTROLES</h2>
            <div id="fps-counter" class="text-gray-400">FPS: 00</div>
        </div>

        <!-- Cenas p5.js -->
        <div class="mb-4">
            <h3 class="text-purple-400 font-bold mb-2 uppercase tracking-wider">Cenas 2D (p5.js)</h3>
            <div class="grid grid-cols-2 gap-2 max-h-32 overflow-y-auto pr-1 custom-scroll">
                <button onclick="changeScene(1)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center active-scene" id="btn-scene-1">1. Espectro</button>
                <button onclick="changeScene(2)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-2">2. Partículas</button>
                <button onclick="changeScene(3)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-3">3. Túnel</button>
                <button onclick="changeScene(4)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-4">4. Glitch</button>
                <button onclick="changeScene(5)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-5">5. Onda</button>
                <button onclick="changeScene(6)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-6">6. Mandala</button>
                <button onclick="changeScene(7)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-7">7. Matrix</button>
                <button onclick="changeScene(8)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-8">8. Pixels</button>
                <button onclick="changeScene(9)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-9">9. Estrelas</button>
                <button onclick="changeScene(10)" class="p-2 bg-gray-800 hover:bg-cyan-900 border border-gray-700 hover:border-cyan-500 rounded transition text-center" id="btn-scene-10">10. Flow</button>
            </div>
        </div>

        <!-- Cenas Three.js -->
        <div class="mb-6">
            <h3 class="text-orange-400 font-bold mb-2 uppercase tracking-wider">Cenas 3D (Three.js)</h3>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="changeScene(11)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-11">
                    <span>11. City</span> <span class="text-gray-500 text-[10px] mt-1">[Q]</span>
                </button>
                <button onclick="changeScene(12)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-12">
                    <span>12. Vortex</span> <span class="text-gray-500 text-[10px] mt-1">[W]</span>
                </button>
                <button onclick="changeScene(13)" class="p-2 bg-gray-800 hover:bg-orange-900 border border-gray-700 hover:border-orange-500 rounded transition text-center flex justify-between px-4" id="btn-scene-13">
                    <span>13. Planet</span> <span class="text-gray-500 text-[10px] mt-1">[E]</span>
                </button>
            </div>
        </div>

        <!-- Seção de Áudio -->
        <div class="mb-6">
            <h3 class="text-green-400 font-bold mb-2 uppercase tracking-wider">Áudio & Beat</h3>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span>Sensibilidade</span> <span id="val-sens">1.5</span></label>
                <input type="range" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('sens', this.value)">
            </div>
            
            <!-- Visualizador de Níveis -->
            <div class="flex gap-1 h-8 mt-2">
                <div class="flex-1 bg-gray-900 flex flex-col justify-end relative border border-gray-700">
                    <div id="bar-bass" class="bg-red-500 w-full opacity-80" style="height: 0%"></div>
                </div>
                <div class="flex-1 bg-gray-900 flex flex-col justify-end relative border border-gray-700">
                    <div id="bar-mid" class="bg-yellow-500 w-full opacity-80" style="height: 0%"></div>
                </div>
                <div class="flex-1 bg-gray-900 flex flex-col justify-end relative border border-gray-700">
                    <div id="bar-treble" class="bg-blue-500 w-full opacity-80" style="height: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Seção Visual -->
        <div class="mb-6">
            <h3 class="text-yellow-400 font-bold mb-2 uppercase tracking-wider">Ajustes Visuais</h3>
            
            <!-- Seletor de Paleta -->
            <div class="mb-3">
                <label class="block mb-1"><span>Paleta de Cores</span></label>
                <select id="palette-select" onchange="changePalette(this.value)" class="w-full bg-gray-900 border border-gray-700 text-white rounded p-2 text-sm focus:border-cyan-500 focus:outline-none">
                    <option value="neon" selected>Neon</option>
                    <option value="fire">Fogo</option>
                    <option value="ocean">Oceano</option>
                    <option value="forest">Floresta</option>
                    <option value="sunset">Pôr do Sol</option>
                    <option value="rainbow">Arco-íris</option>
                    <option value="monochrome">Monocromático</option>
                    <option value="custom">Personalizado</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span>Velocidade</span> <span id="val-speed">1.0</span></label>
                <input type="range" min="0.1" max="3.0" step="0.1" value="1.0" oninput="updateParam('speed', this.value)">
            </div>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span>Matiz (Cor)</span> <span id="val-hue">0</span></label>
                <input type="range" min="0" max="360" step="1" value="0" oninput="updateParam('hue', this.value)">
            </div>
            <div class="mb-3">
                <label class="flex justify-between mb-1"><span>Rastro (Trail)</span> <span id="val-trail">40</span></label>
                <input type="range" min="0" max="255" step="5" value="40" oninput="updateParam('trail', this.value)">
            </div>
        </div>

        <!-- Ações Globais -->
        <div>
            <button onmousedown="triggerStrobe(true)" onmouseup="triggerStrobe(false)" onmouseleave="triggerStrobe(false)" class="w-full py-3 bg-white text-black font-bold uppercase tracking-widest hover:bg-gray-200 active:bg-red-500 active:text-white transition rounded mb-2">
                FLASH (Space)
            </button>
            <p class="text-gray-500 text-[10px] text-center italic">Key 'H' to Hide UI</p>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/classes.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/palettes.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/scenes-p5.js"></script>
    <script src="js/scenes-three.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
