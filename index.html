<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon VJ Studio - p5.js + Three.js</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- p5.js e p5.sound -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Overlay de Início -->
    <div id="start-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-500">
        <h1 class="text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 animate-pulse">NEON VJ STUDIO</h1>
        <p class="mb-8 text-gray-300 text-xl">Sistema Híbrido p5.js + Three.js</p>
        <button onclick="startAudio()" class="px-8 py-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded-full text-xl shadow-[0_0_20px_rgba(6,182,212,0.6)] transition-all transform hover:scale-105">
            INICIAR SISTEMA
        </button>
        <p class="mt-4 text-sm text-gray-500">Permita o acesso ao microfone.</p>
    </div>

    <!-- Botão para Abrir Controles -->
    <button id="open-controls-btn" class="fixed top-4 right-4 z-50 bg-cyan-600/80 hover:bg-cyan-500/90 text-white font-bold py-3 px-6 rounded-lg shadow-lg backdrop-blur-sm transition-all transform hover:scale-105 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
        </svg>
        <span>CONTROLES</span>
    </button>


    <!-- JavaScript Modules -->
    <script src="js/classes.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/palettes.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/scenes-p5.js"></script>
    <script src="js/scenes-three.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
